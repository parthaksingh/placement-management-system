services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  api:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./server:/app"]
    command: sh -c "npm install && npm run dev"
    environment: ["MONGODB_URI=mongodb://mongo:27017/placesmart", "JWT_SECRET=development-secret"]
    ports: ["5000:5000"]
    depends_on: [mongo]
volumes:
  mongo_data:
